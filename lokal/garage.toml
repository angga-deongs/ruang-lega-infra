# Garage untuk pengembangan lokal: satu node, data di volume Docker.
# Rahasia RPC dan token admin datang dari variabel GARAGE_RPC_SECRET dan GARAGE_ADMIN_TOKEN (.env).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

# Endpoint web menyajikan bucket yang namanya sama dengan Host permintaan (port diabaikan).
# Lokal: bucket "localhost" -> http://localhost:3902/<kunci-file>. Produksi: bucket "media.ruanglega.com".
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
