# Produksi di satu VPS Hostinger KVM 2 (ADR-10). Belum dijalankan; lihat docs/12-deployment.md di storefront.
# Semua rahasia dari .env (salin dari .env.template). Hanya nginx yang membuka port ke internet.
name: ruang-lega

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  medusa-server:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  medusa-worker:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  storefront:
    image: ${STOREFRONT_IMAGE}
    restart: unless-stopped
    environment:
      # Alamat internal untuk panggilan server ke Medusa; alamat publik sudah ditanam saat build.
      MEDUSA_BACKEND_URL: http://medusa-server:9000
      REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET}
      SITE_URL: https://ruanglega.com
    depends_on:
      - medusa-server

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ruanglega.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - storefront
      - medusa-server
      - garage

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    profiles: ["tools"]

volumes:
  postgres:
  redis:
  garage-meta:
  garage-data:
  certbot-www:
  certbot-certs:
