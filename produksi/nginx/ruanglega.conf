# HTTPS dan pembagian domain (docs/02-arsitektur.md). Sertifikat gratis Let's Encrypt lewat certbot (webroot).

# Batas laju POST untuk masuk, daftar, kata sandi, dan checkout per IP; GET tidak dibatasi.
map $request_method $limit_post_key {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $limit_post_key zone=sensitive:10m rate=20r/m;

server {
  listen 80;
  server_name ruanglega.com www.ruanglega.com api.ruanglega.com media.ruanglega.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.ruanglega.com;
  ssl_certificate /etc/letsencrypt/live/ruanglega.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ruanglega.com/privkey.pem;
  return 301 https://ruanglega.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ruanglega.com;
  ssl_certificate /etc/letsencrypt/live/ruanglega.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ruanglega.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # Snap Midtrans dimuat dari app.midtrans.com (produksi) dan membuka iframe pembayaran.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.midtrans.com https://app.sandbox.midtrans.com; frame-src https://app.midtrans.com https://app.sandbox.midtrans.com https://www.google.com https://maps.google.com; img-src 'self' data: https://media.ruanglega.com; connect-src 'self' https://api.ruanglega.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'self'" always;

  client_max_body_size 2m;

  location ~ ^/(akun/(masuk|daftar|lupa-kata-sandi|reset)|checkout) {
    limit_req zone=sensitive burst=10 nodelay;
    proxy_pass http://storefront:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://storefront:3000;
    # Ditimpa (bukan ditambah) agar IP pembeli tidak bisa dipalsukan; storefront membaca IP ini untuk batas laju.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.ruanglega.com;
  ssl_certificate /etc/letsencrypt/live/ruanglega.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ruanglega.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Foto produk diunggah lewat Admin.
  client_max_body_size 20m;

  location / {
    proxy_pass http://medusa-server:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name media.ruanglega.com;
  ssl_certificate /etc/letsencrypt/live/ruanglega.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ruanglega.com/privkey.pem;

  add_header X-Content-Type-Options "nosniff" always;

  # Website endpoint Garage memilih bucket dari header Host (ADR-24); bucket produksi bernama media.ruanglega.com.
  location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://garage:3902;
    proxy_set_header Host media.ruanglega.com;
    expires 30d;
  }
}
